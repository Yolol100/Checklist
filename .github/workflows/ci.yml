name: CI

on:
  push:
    branches: [main, "build/**", "agent/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax check
        run: npm run check
      - name: Smoke test evidence runner
        run: npm run scan
      - name: Validate raw evidence contract
        run: npm run validate-result
      - name: Verify reproducibility artifacts
        run: |
          test -f artifacts/latest/browser/desktop/page.png
          test -f artifacts/latest/browser/desktop/axe.json
          test -f artifacts/latest/browser/desktop/trace.zip
          test -f artifacts/latest/browser/mobile/page.png
          test -f artifacts/latest/browser/mobile/axe.json
          test -f artifacts/latest/browser/mobile/trace.zip
