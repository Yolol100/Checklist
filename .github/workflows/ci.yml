name: CI

on:
  push:
    branches: [main, "build/**", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Adversarial unit and workflow tests
        run: npm test
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Smoke test raw evidence runner
        run: npm run scan
      - name: Validate raw evidence contract
        run: npm run validate-result
      - name: Verify public-test evidence is not mislabeled production
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('results/latest.json', 'utf8'));
          const http = result.evidence_registry.find((item) => item.id === 'EV-HTTP-MAIN');
          if (result.request.target_environment !== 'public_test') throw new Error('CI fixture must remain public_test');
          if (http?.evidence_level === 'production_observation') throw new Error('public_test target was incorrectly labeled production_observation');
          NODE
      - name: Verify rendered DOM authority
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('results/latest.json', 'utf8'));
          const readiness = result.observations.find((item) => item.id === 'RUNTIME-UI-READINESS');
          const links = result.observations.find((item) => item.id === 'LINK-001');
          if (readiness?.outcome !== 'observed_ok') throw new Error('UI-readiness fixture is niet observed_ok');
          if (links?.data?.basis !== 'rendered_dom') throw new Error(`LINK-001 moet rendered_dom gebruiken, kreeg ${links?.data?.basis}`);
          if (!links?.evidence_ids?.includes('EV-BROWSER-DESKTOP')) throw new Error('LINK-001 mist rendered browser-evidence');
          if (links?.data?.concurrency_limit !== 6) throw new Error('Linkprobe concurrency guard ontbreekt');
          NODE
      - name: Verify material fingerprint repeatability
        run: |
          FIRST="$(node -p "JSON.parse(require('fs').readFileSync('results/latest.json','utf8')).artifact_fingerprint_sha256")"
          npm run scan
          npm run validate-result
          SECOND="$(node -p "JSON.parse(require('fs').readFileSync('results/latest.json','utf8')).artifact_fingerprint_sha256")"
          test -n "$FIRST"
          test "$FIRST" = "$SECOND"
      - name: Verify run history and reproducibility artifacts
        run: |
          test -f results/runs/final-e2e-v0.5-20260815-1755z.json
          test -f artifacts/runs/final-e2e-v0.5-20260815-1755z/browser/desktop/page.png
          test -f artifacts/runs/final-e2e-v0.5-20260815-1755z/browser/desktop/axe.json
          test -f artifacts/runs/final-e2e-v0.5-20260815-1755z/browser/desktop/dom-inventory.json
          test -f artifacts/runs/final-e2e-v0.5-20260815-1755z/browser/desktop/trace.zip
          test -f artifacts/runs/final-e2e-v0.5-20260815-1755z/browser/mobile/page.png
          test -f artifacts/runs/final-e2e-v0.5-20260815-1755z/browser/mobile/axe.json
          test -f artifacts/runs/final-e2e-v0.5-20260815-1755z/browser/mobile/dom-inventory.json
          test -f artifacts/runs/final-e2e-v0.5-20260815-1755z/browser/mobile/trace.zip
      - name: Build formal evidence manifest from isolated policy fixture
        run: node src/finalize.js policy/fixture.json results/formal-ci.json
      - name: Validate formal Evidence Manifest 3.0 semantics
        run: node src/validate-formal.js results/formal-ci.json
      - name: Verify full Go is blocked without staging capability
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('results/formal-ci.json', 'utf8'));
          const evidenceId = source.evidence_registry[0].id;
          source.release_decision = 'go';
          source.rollback = { available: true, tested: true, plan: 'negative gate fixture', owner: 'website-qa-checklist', evidence_ids: [evidenceId] };
          source.monitoring = { ready: true, plan: 'negative gate fixture', owner: 'website-qa-checklist', evidence_ids: [evidenceId] };
          fs.writeFileSync('results/formal-unsafe-go.json', `${JSON.stringify(source, null, 2)}\n`);
          NODE
          if node src/validate-formal.js results/formal-unsafe-go.json; then
            echo "Unsafe Go was incorrectly accepted."
            exit 1
          fi
