name: Toolkit Contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'toolkit-contract.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate registered toolkit is accountless and wired
        run: |
          python3 - <<'PY'
          import json, pathlib
          c=json.load(open('toolkit-contract.json', encoding='utf-8'))
          for key in ('requires_account','requires_api_key','requires_mcp'):
              assert c.get(key) is False, f'{key} must be false'
          ids=[t['id'] for t in c['tools']]
          assert len(ids)==len(set(ids)), 'duplicate tool ids'
          covered=set()
          for a in c['usage_assertions']:
              assert a['tool'] in ids
              p=pathlib.Path(a['path']); assert p.is_file(), f'missing {p}'
              assert a['contains'] in p.read_text(encoding='utf-8'), f"{a['tool']} not wired in {p}"
              covered.add(a['tool'])
          assert covered==set(ids), f'unwired tools: {set(ids)-covered}'
          workflow=pathlib.Path('.github/workflows/run-checklist.yml').read_text(encoding='utf-8')
          assert 'firefox webkit' in workflow
          assert '@lhci/cli@0.15.1' in workflow
          assert 'VNU_SHA256' in workflow
          assert 'lhci collect --url="$TARGET_URL" --numberOfRuns=1 --settings.chromeFlags="--no-sandbox"' in workflow
          assert 'PLAYWRIGHT_CHROMIUM_ARGS=--no-sandbox' not in workflow
          assert 'CHECKLIST_BROWSER_ARGS=--no-sandbox' not in workflow
          print('toolkit-contract: OK')
          PY
