name: Run Checklist

on:
  push:
    branches:
      - main
    paths:
      - requests/current.json

permissions:
  contents: write

concurrency:
  group: checklist-run
  cancel-in-progress: true

jobs:
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate runner
        run: npm run check

      - name: Run checklist evidence collection
        run: npm run scan

      - name: Validate raw evidence contract
        run: npm run validate-result

      - name: Save immutable run evidence and latest pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest.json results/runs artifacts/runs
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "Update checklist raw evidence"
            git push origin HEAD:main
          fi
