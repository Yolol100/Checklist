name: Run Checklist

on:
  push:
    branches:
      - main
    paths:
      - requests/current.json

permissions:
  contents: write

concurrency:
  group: checklist-run
  cancel-in-progress: true

jobs:
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate runner
        run: npm run check

      - name: Run checklist
        run: npm run scan

      - name: Save latest result to repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'results/latest.json';
            const content = Buffer.from(fs.readFileSync(path, 'utf8')).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main'
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Update latest checklist result',
              content,
              sha,
              branch: 'main'
            });
