name: Finalize Checklist

on:
  push:
    branches:
      - main
    paths:
      - policy/current.json

permissions:
  contents: write

concurrency:
  group: checklist-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate adapter syntax
        run: npm run check

      - name: Build formal evidence manifest
        run: npm run finalize

      - name: Validate formal Evidence Manifest 3.0 semantics
        run: npm run validate-formal

      - name: Save formal manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/formal-latest.json
          if git diff --cached --quiet; then
            echo "No formal evidence changes to commit."
          else
            git commit -m "Update checklist formal evidence"
            git push origin HEAD:main
          fi
