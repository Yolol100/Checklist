name: Temporary secure dependency lock refresh
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/temporary-secure-lock.yml
permissions:
  contents: write
jobs:
  update-verified-lock:
    if: github.repository == 'Yolol100/Checklist' && github.event.pull_request.head.repo.full_name == 'Yolol100/Checklist' && github.event.pull_request.head.ref == 'quality/secure-glob-lighthouse-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact trusted pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: quality/secure-glob-lighthouse-20261105
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Recalculate lock without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate pinned corrected graph
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          if (p.overrides?.glob !== '14.0.3' || p.overrides?.minimatch !== '11.0.4') throw Error('Unapproved overrides');
          for (const [key, expected] of Object.entries({'node_modules/glob': '14.0.3', 'node_modules/minimatch': '11.0.4'})) {
            if (l.packages[key]?.version !== expected) throw Error('Unpatched lock dependency ' + key + ': ' + l.packages[key]?.version);
          }
          console.log('Pinned graph: glob 14.0.3 and minimatch 11.0.4.');
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls glob minimatch lighthouse
      - name: Submit only dependency lock to this trusted PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: quality/secure-glob-lighthouse-20261105
        shell: bash
        run: |
          set -euo pipefail
          test "$BRANCH" = "quality/secure-glob-lighthouse-20261105"
          SHA="$(gh api "repos/Yolol100/Checklist/contents/package-lock.json?ref=$BRANCH" --jq '.sha')"
          export SHA
          node <<'NODE'
          const fs = require('node:fs');
          const contents = fs.readFileSync('package-lock.json');
          fs.writeFileSync('/tmp/secure-lock-payload.json',JSON.stringify({
            message:'security: regenerate lock with patched glob14 and minimatch11',
            content:contents.toString('base64'),
            sha:process.env.SHA,
            branch:process.env.BRANCH
          }));
          NODE
          gh api --method PUT repos/Yolol100/Checklist/contents/package-lock.json --input /tmp/secure-lock-payload.json --jq '.commit.sha'
