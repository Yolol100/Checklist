name: Apply final hardening

on:
  push:
    branches:
      - fix/final-hardening-20260817
    paths:
      - '.github/workflows/apply-final-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Replace global LHCI with locked local CLI
        shell: bash
        run: |
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/@lhci/cli']?.version!=='0.15.1') process.exit(1)"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/run-checklist.yml')
          text = path.read_text(encoding='utf-8')
          old = "      - name: Install Lighthouse CI\n        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'release'\n        run: npm install --global @lhci/cli@0.15.1\n"
          if text.count(old) != 1:
              raise SystemExit(f'global LHCI install: expected 1 match, got {text.count(old)}')
          text = text.replace(old, "", 1)
          old_cmd = '          lhci collect --url="$TARGET_URL" --numberOfRuns=1'
          new_cmd = '          npx --no-install lhci collect --url="$TARGET_URL" --numberOfRuns=1'
          if text.count(old_cmd) != 1:
              raise SystemExit(f'LHCI command: expected 1 match, got {text.count(old_cmd)}')
          text = text.replace(old_cmd, new_cmd, 1)
          path.write_text(text, encoding='utf-8')
          PY
          ! grep -q 'npm install --global @lhci/cli' .github/workflows/run-checklist.yml
          grep -q 'npx --no-install lhci collect' .github/workflows/run-checklist.yml
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/run-checklist.yml
          git commit -m 'ci: use locked local Lighthouse CLI'
          git push origin HEAD:fix/final-hardening-20260817
