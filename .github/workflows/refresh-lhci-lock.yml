name: Refresh LHCI lockfile

on:
  push:
    branches:
      - fix/final-hardening-20260817
    paths:
      - 'package.json'
      - '.github/workflows/refresh-lhci-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact LHCI version is locked
        run: |
          node -e "const p=require('./package-lock.json'); if (p.packages['node_modules/@lhci/cli']?.version !== '0.15.1') process.exit(1)"
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'build: refresh locked Lighthouse dependency'
          git push origin HEAD:fix/final-hardening-20260817
