name: Diagnose Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run test files individually
        shell: bash
        run: |
          failed=0
          for testfile in test/*.test.js; do
            if ! node --test "$testfile"; then
              echo "::error file=${testfile}::Test file failed in PR validation"
              failed=1
            fi
          done
          exit "$failed"
