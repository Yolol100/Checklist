name: Generate lockfile

on:
  push:
    branches:
      - agent/fix-full-integration-v2
    paths:
      - package.json
      - .github/workflows/generate-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-full-integration-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add reproducible npm lockfile"
          git push origin HEAD:agent/fix-full-integration-v2
